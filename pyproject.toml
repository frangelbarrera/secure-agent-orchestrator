[project]
name = "secure-agent-orchestrator"
version = "0.2.0"
description = "FastAPI control plane for registering security agents and their command tasks. Honest, audited, SQLite-only."
authors = [{ name = "Frangel Raúl Crespo Barrera", email = "201400231+frangelbarrera@users.noreply.github.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11, <4"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.6.1",
    "fastapi>=0.109.1",
    "uvicorn>=0.27.0",
    "uvloop>=0.19.0",
    "httptools>=0.6.1",
    "uuid6>=2024.1.12",
    "alembic>=1.13.1",
    "aiosqlite>=0.19.0",
    "SQLAlchemy-Utils>=0.41.1",
    "python-jose>=3.3.0",
    "SQLAlchemy>=2.0.25",
    "python-multipart>=0.0.18",
    "greenlet>=2.0.2",
    "pydantic-settings>=2.0.3",
    "bcrypt>=4.1.1",
    "fastcrud>=0.19.2",
    "crudadmin>=0.4.2",
    "gunicorn>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.13",
    "mypy>=1.16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.26.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "scripts"]
python_files = ["test_*.py", "smoke_test.py"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle
    "W",   # Warning
    "C",   # Complexity (mccabe+) & comprehensions
    "UP",  # pyupgrade
    "I",   # isort
]
ignore = [
    "E402",  # module level import not at top of file
    "UP006", # use-pep585-annotation
    "UP007", # use-pep604-annotation
    "E741",  # Ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # unused import
    "F403", # star imports
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
